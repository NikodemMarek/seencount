[package]
name = "seencount"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "server"
path = "src/server/main.rs"

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }
serde-wasm-bindgen = "0.6.5"
wasm-bindgen = "0.2"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
tiny_http = "0.12"
serde_json = "1"

[profile.release]
# opt-level = "s"
lto = true
